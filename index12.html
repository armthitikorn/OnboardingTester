        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        const quizHeader = document.getElementById('quizHeader').textContent;

document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
    if (storedName) {
        nameInput.value = storedName;
    }

    // 🔑 สร้างรหัสรอบการทำข้อสอบ (session_id) — 1 ครั้งต่อการเข้าทำ 1 รอบ
    currentSessionId = urlParams.get('session') || sessionStorage.getItem('current_test_session') || crypto.randomUUID();
    sessionStorage.setItem('current_test_session', currentSessionId);
});

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            // --- กำหนดระดับความรู้ตามช่วงคะแนน ---
            let levelName = "";
            let boxBgColor = "";
            let boxTextColor = "";

            if (score <= 50) {
                levelName = "เริ่มต้น";
                boxBgColor = '#fff3cd'; 
                boxTextColor = '#856404';
            } else if (score >= 51 && score <= 70) {
                levelName = "มาตรฐาน";
                boxBgColor = '#d1ecf1'; 
                boxTextColor = '#0c5460';
            } else if (score <= 71) {
                levelName = "ผู้เชี่ยวชาญ";
                boxBgColor = '#d1ffd1'; 
                boxTextColor = '#005900';
            }

            try {
                // บันทึกข้อมูลรวมถึงฟิลด์ level ลงใน Supabase
                const { error } = await supabase
                    .from('quiz_results')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience,
                        quiz_set: quizHeader,
                        level: levelName 
                        session_id: currentSessionId   // ✅ เพิ่มบรรทัดนี้
                    }]);

                if (error) throw error; 

                // แสดงผลลัพธ์และระดับความรู้หน้าจอผู้สอบ
                resultDiv.innerHTML = `📊 ผลการประเมินของคุณ: ระดับ <strong>${levelName}</strong><br>ได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%)`;
                resultDiv.style.backgroundColor = boxBgColor;
                resultDiv.style.color = boxTextColor;
                resultDiv.style.display = 'block';

                quizForm.style.display = 'none';
                submitBtn.style.display = 'none';

// 📌 เปลี่ยนจากปุ่มทำใหม่ เป็นปุ่มพาไปทำข้อสอบอัตนัย (Index 13)
const nextBtn = document.createElement('button');
nextBtn.textContent = '✍️ ไปทำข้อสอบอัตนัย (ชุดถัดไป)';
nextBtn.style.backgroundColor = '#8b5cf6'; // ใช้สีม่วงเพื่อให้แตกต่าง
nextBtn.onclick = () => {
    // ส่งชื่อและอีเมลติดตัวไปกับ URL ของหน้าข้อสอบอัตนัย (สามารถเปลี่ยนชื่อไฟล์ subjective.html เป็นหน้าอัตนัยของคุณได้เลยครับ)
const targetUrl = `index13.html?name=${encodeURIComponent(userNameVal)}&email=${encodeURIComponent(userEmail)}&experience=${encodeURIComponent(userExperience)}&score=${score}&total=${totalQuestions}&level=${encodeURIComponent(levelName)}&session=${encodeURIComponent(currentSessionId)}`;
actionContainer.innerHTML = ''; 
actionContainer.appendChild(nextBtn);

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });
    </script>
