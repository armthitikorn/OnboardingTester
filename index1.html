<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แบบทดสอบ: PRUgreat return plus 20/10</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f9faff;
            color: #333;
            padding: 20px;
        }
        h2 {
            color: #004080;
            text-align: center;
            margin-bottom: 30px;
        }
        .question-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
        }
        .question h3 {
            color: #0059b3;
            margin-bottom: 10px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .choices {
            list-style: none;
            padding: 0;
        }
        .choices li {
            margin-bottom: 8px;
        }
        .choices label {
            display: block;
            background: #e6f2ff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .choices label:hover {
            background-color: #cce6ff;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px auto 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #005fa3;
        }
        #result {
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
        }
        .loading-text {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 50px;
        }
        .hidden {
            display: none;
        }
        
        /* สไตล์สำหรับใบประกาศนียบัตรจำลอง */
        #certificate-wrapper {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
        #certificate {
            background: #fff;
            border: 15px solid #004080;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .cert-inner {
            border: 2px solid #d4af37;
            padding: 50px 30px;
            background-color: #faf9f5;
        }
        .cert-title {
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            font-size: 2.5rem; 
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .cert-name {
            color: #004080; 
            font-size: 2rem;
            border-bottom: 2px solid #004080; 
            display: inline-block; 
            padding: 0 40px 5px;
            margin: 20px 0;
            font-weight: bold;
        }
        
@media print {
            /* 1. ซ่อนเนื้อหาอื่นนอกเหนือจากใบประกาศ */
            body > *:not(#certificate-wrapper) {
                display: none !important;
            }
            
            /* 2. บังคับซ่อนปุ่มทุุกชนิดและลิงก์ตอนสั่งพรินต์ */
            #certificate-wrapper button, 
            #certificate-wrapper a {
                display: none !important;
            }
            
            body {
                background: #fff;
                margin: 0;
                padding: 0;
            }
            
            /* 3. จัดกึ่งกลางหน้ากระดาษใหม่แบบเสถียรสุด */
            #certificate-wrapper {
                display: block !important;
                width: 100%;
                text-align: center;
                margin: 0;
                padding: 20px 0; /* เพิ่มพื้นที่ด้านบนนิดหน่อยให้ดูสวยงาม */
            }
            
#certificate {
                visibility: visible;
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;
                transform: translate(-50%, -50%) !important;
                width: 90% !important;
                max-width: 950px !important;
                box-shadow: none !important;
                margin: 0 !important;
            }
            
            /* 4. ปรับหน้ากระดาษ และตั้ง margin: 0 เพื่อซ่อนวันที่/URL ของเบราว์เซอร์ */
            @page {
                size: A4 landscape;
                margin: 0mm; 
            }
        }
    </style>
</head>
<body>

    <h2 id="quizHeader">แบบทดสอบปรนัย: PRUgreat return plus 20/10 (20 ข้อ)</h2>

    <div id="loading" class="loading-text">กำลังโหลดแบบทดสอบ...</div>

    <div style="margin-bottom: 20px;">
        <label for="name">ชื่อผู้ทำแบบทดสอบ:</label>
        <input type="text" id="name" name="name" required style="width:100%;padding:10px;margin-top:5px;" placeholder="กรุณากรอกชื่อ-นามสกุล">
    </div>
    
    <form id="quizForm" class="hidden"></form>

    <button id="submitBtn" class="hidden">ส่งคำตอบ</button>

    <div id="result"></div>
    <div id="actionContainer" style="text-align: center; margin-top: 20px;"></div>

    <!-- ส่วนแสดงใบประกาศนียบัตร -->
    <div id="certificate-wrapper">
        <div id="certificate">
            <div class="cert-inner">
                <h1 class="cert-title">Certificate of Achievement</h1>
                <p style="font-size: 1.2rem; color: #555; margin-top: 20px;">ขอมอบประกาศนียบัตรฉบับนี้เพื่อให้เกียรติว่า</p>
                <h2 id="certName" class="cert-name">-</h2>
                <p style="font-size: 1.2rem; color: #555; margin-top: 10px;">
                    ได้ผ่านการทดสอบหลักสูตร <br> 
                    <strong id="certCourseName" style="color: #333; font-size: 1.5rem;">-</strong> <br> 
                    ด้วยคะแนนที่ผ่านเกณฑ์มาตรฐานอย่างสมบูรณ์
                </p>
                <div style="margin-top: 50px; text-align: center;">
                    <div style="display: inline-block; width: 200px; border-top: 1px solid #333; padding-top: 10px; margin: 0 20px;">
                        <p style="margin: 0; font-size: 0.9rem;">Prudential Life Assurance</p>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="downloadCertBtn" style="background-color: #28a745; max-width: 250px; margin: 30px auto;">
            📥 ดาวน์โหลดใบประกาศ
        </button>
        <!-- ลิงก์สำหรับไปชุดที่ 2 -->
        <a href="index2.html" id="nextPageLink" style="text-decoration: none;">
            <button style="margin-top: 10px; background-color: #007acc; max-width: 250px; margin: 10px auto;">ไปหน้าถัดไป (ชุดที่ 2)</button>
        </a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // --- Supabase Setup ---
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // ข้อมูลคำถาม ชุดที่ 1
        const questions = [
            { q: "4.1. แบบประกัน PRUgreat return plus มีระยะเวลาเอาประกันกี่ปี", a: "C", choices: ["10", "15", "20", "25"] },
            { q: "5.2. แบบประกัน PRUgreat return plus มีระยะเวลาชำระเบี้ยประกันกี่ปี", a: "B", choices: ["5", "10", "15", "20"] },
            { q: "6.3. เงินคืนระหว่างสัญญา  ณ วันครบรอบปี กธ. ที่  1 - 10  ได้เงินคืนปีละ เท่าไหร่ ?", a: "B", choices: ["2%", "3%", "4%", "5%"] },
            { q: "7.4.  เงินคืนระหว่างสัญญา  ณ วันครบรอบปี กธ. ที่  11 - 19  ได้เงินคืนปีละ เท่าไหร่ ?", a: "D", choices: ["2%", "3%", "5%", "6%"] },
            { q: "8.5. เงินครบกำหนดสัญญา ณ วันครบรอบปีกธ.ที่ 20 กี่ % ของจำนวนเงินเอาประกัน ?", a: "C", choices: ["100%", "150%", "200%", "250%"] },
            { q: "9.6. กรณีผู้เอาประกันภัยเสียชีวิต ปี กธ. ที่ 1 - 2 (ไม่ใช่อุบัติเหตุ) บริษัทจะจ่ายเงินในข้อใด ?", a: "B", choices: ["ร้อยละ 100 ของเบี้ยประกันภัยของกรมธรรม์ที่ชำระมาแล้วทั้งหมด", "ร้อยละ 110 ของเบี้ยประกันภัยของกรมธรรม์ที่ชำระมาแล้วทั้งหมด", "ร้อยละ 120 ของเบี้ยประกันภัยของกรมธรรม์ที่ชำระมาแล้วทั้งหมด", "ร้อยละ 130 ของเบี้ยประกันภัยของกรมธรรม์ที่ชำระมาแล้วทั้งหมด"] },
            { q: "10.7. PRUgreat return plus 20/10 อายุรับประกันเท่าไหร่ ?", a: "A", choices: ["20 – 55 ปี", "20 - 60 ปี", "25 - 55 ปี", "25 - 60 ปี"] },
            { q: "11.8. หากผู้เอาประกันเสียชีวิตด้วยอุบัติเหตุ ในปี กธ. 11 - 20 รับผลประโยชน์เพิ่ม ในข้อใด ?", a: "B", choices: ["100% ของจำนวนเงินเอาประกันภัย", "200% ของจำนวนเงินเอาประกันอุบัติเหตุ", "300% ของจำนวนเงินเอาประกันภัย", "400% ของจำนวนเงินเอาประกันภัย"] },
            { q: "12.9. ผู้เอาประกันภัยสามารถคงเงินคืนระหว่างสัญญาไว้กับบริษัทฯ เพื่อรับดอกเบี้ยเพิ่มได้หรือไม่", a: "D", choices: ["หากจ่ายเบี้ยสูง สามารถรับดอกเบี้ยเพิ่มได้", "ได้บางส่วน", "สามารถคงเงินคืน เพื่อรับดอกเบี้ยเพิ่มได้", "ไม่สามารถคงเงินคืน เพื่อรับดอกเบี้ยเพิ่มได้"] },
            { q: "13.10.แบบประกัน PRUgreat return plus 20/10 สามารถนำเบี้ยประกันไปหักลดหย่อนภาษีได้สูงสุด กี่บาท ?", a: "A", choices: ["100,000", "150,000", "200,000", "250,000"] },
            { q: "14.11. แบบประกันนี้สามารถกู้ได้สูงสุดกี่ % ของเงินค่าเวนคืน ?", a: "C", choices: ["70", "80", "90", "100"] },
            { q: "15.12. ดอกเบี้ยในการกู้กรมธรรม์ คือ ?", a: "C", choices: ["7.0", "7.1", "7.2", "7.3"] },
            { q: "16.13. ผู้เอาประกันสามารถผ่อนผันการชำระเบี้ยประกันได้กี่วัน ?", a: "D", choices: ["28", "29", "30", "31"] },
            { q: "17.14. สิทธิในการขอยกเลิกกรมธรรม์ (Free Look Period) ภายในกี่วัน ?", a: "A", choices: ["30", "15", "10", "5"] },
            { q: "18.15.ทุนประกันสูงสุดของ PRUgreat return plus 20/10 คือเท่าไหร่ ?", a: "D", choices: ["200,000", "300,000", "400,000", "500,000"] },
            { q: "19.16. ชั้นอาชีพที่สามารถซื้อ PRUgreat return plus 20/10 ได้คือข้อใด", a: "D", choices: ["ได้เฉพาะชั้นอาชีพ 1 เท่านั้น", "ได้เฉพาะชั้นอาชีพ 2 เท่านั้น", "ได้เฉพาะชั้นอาชีพ 3 - 4 เท่านั้น", "รับประกันชั้นอาชีพ 1 - 4"] },
            { q: "20.17. บริษัทจะไม่จ่ายผลประโยชน์กรณีเสียชีวิตจากอุบัติเหตุ เมื่อปรากฏว่า พบปริมาณแอลกอฮอล์ในเลือดตั้งแต่กี่ มิลลิกรัม % ขั้นไป", a: "B", choices: ["100", "150", "200", "250"] },
            { q: "21.18. หากผู้เอาประกันเสียชีวิตด้วยอุบัติเหตุ ในขณะที่ตนเองขับขี่หรือ โดยสารรถจักรยานยนต์ บริษัทจะจ่ายผลประโยชน์ข้อใด ?", a: "A", choices: ["บริษัทจะไม่จ่ายผลประโยชน์กรณีเสียชีวิตจากอุบัติเหตุ", "จ่ายมูลค่าขยายเวลา", "จ่ายมูลค่าเวณคืน", "จ่ายมูลค่าไถ่ถอนกรมธรรม์"] },
            { q: "22.19. ผู้เอาประกันสามารถเลือกชำระเบี้ยประกันชีวิตได้อย่างไรบ้าง", a: "D", choices: ["จ่ายเบี้ยรายปี", "จ่ายเบี้ยราย 6 เดือน หรือราย 3 เดือน", "จ่ายเบี้ยรายเดือน", "ถูกทุกข้อ"] },
            { q: "23.20. แบบประกันนี้สามารถแนบสัญญาเพิ่มเติมอื่นได้หรือไม่?", a: "A", choices: ["ไม่ได้", "ได้ตามดุลยพินิจบริษัท", "ได้ปกติ", "ได้เฉพาะสุขภาพ"] }
        ];

        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        
        const certificateWrapper = document.getElementById('certificate-wrapper');
        const certName = document.getElementById('certName');
        const certCourseName = document.getElementById('certCourseName');
        const downloadCertBtn = document.getElementById('downloadCertBtn');
        const quizHeader = document.getElementById('quizHeader').textContent;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
            if (storedName) {
                nameInput.value = storedName;
            }
        });

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            try {
                const { error } = await supabase
                    .from('quiz_results')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience
                    }]);

                if (error) throw error; 

                if (percentage >= 80) {
                    resultDiv.innerHTML = `🎉 ยินดีด้วย! คุณสอบผ่าน (${percentage}%) ได้คะแนน ${score} จาก ${totalQuestions} ข้อ`;
                    resultDiv.style.backgroundColor = '#d1ffd1';
                    resultDiv.style.color = '#005900';
                    
                    certName.textContent = userNameVal;
                    certCourseName.textContent = quizHeader.replace('แบบทดสอบปรนัย: ', '').replace(/\s*\(.*\)/, '');
                    
                    certificateWrapper.style.display = 'block';
                    quizForm.style.display = 'none';
                    submitBtn.style.display = 'none';
                } else {
                    resultDiv.innerHTML = `❌ คุณได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%) ยังไม่ผ่านเกณฑ์ (ต้องได้ 80% ขึ้นไป)`;
                    resultDiv.style.backgroundColor = '#ffd1d1';
                    resultDiv.style.color = '#900';
                    submitBtn.style.display = 'none';

                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'ทำแบบทดสอบใหม่อีกครั้ง';
                    retryBtn.style.backgroundColor = '#dc3545';
                    retryBtn.onclick = () => location.reload();
                    actionContainer.innerHTML = ''; 
                    actionContainer.appendChild(retryBtn);
                }

                resultDiv.style.display = 'block';

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });

        downloadCertBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
