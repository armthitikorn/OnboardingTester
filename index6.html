            { q: "4. หากคุณสงสัยว่าลูกค้าของคุณอาจจะเกี่ยวข้องกับการกระทำความผิดด้านการฟอกเงิน คุณควรจะต้องปฏิบัติอย่างไร", a: "C", choices: ["ปรึกษาเรื่องนี้กับเพื่อนร่วมงานของคุณเพื่อขอคำแนะนำ", "เก็บเรื่องนี้เอาไว้คนเดียว", "แจ้งเหตุสงสัยให้แก่บริษัททราบโดยเร็ว", "ติดต่อลูกค้าของคุณเพื่ออธิบายเหตุต้องสงสัย"] },

            { q: "8. ข้อใดต่อไปนี้ถือเป็นคำอธิบายของการสนับสนุนทางการเงินแก่การก่อการร้ายได้ดีที่สุด", a: "A", choices: ["การจ่ายเงินเพื่อวัตถุประสงค์ให้มีการก่อการร้าย", "การที่ผู้ก่อการร้ายใช้เงินในกองทุนเพื่อหลีกเลี่ยงภาษี", "การฟอกเงินโดยอาศัยกิจกรรมภายใต้การก่อการร้าย", "การหาเงินจากการก่อการร้าย"] },
            { q: "9. “หลังจากที่มีการดำเนินการตามขั้นตอนรู้จักตัวตนลูกค้า และ การตรวจสอบเพื่อทราบข้อเท็จจริงเกี่ยวกับลูกค้า (KYC/CDD) ในเบื้องต้นแล้ว เราไม่จำเป็นต้องตรวจสอบเพื่อทราบข้อเท็จจริงลูกค้าเพิ่มเติมอีก ถึงแม้ว่าลูกค้ารายนั้นจะมีความเสี่ยงสูงด้านการฟอกเงิน” ข้อความนี้ถูกหรือผิด?", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "10. คุณมีหน้าที่ใดในการปฎิบัติตามนโยบายเกี่ยวกับการต่อต้านและป้องกันการฟอกเงิน", a: "D", choices: ["จัดทำรายงานธุรกรรมที่มีเหตุอันควรสงสัยของลูกค้าให้แก่สำนักงาน ปปง. ด้วยตนเอง", "เฝ้าระวังพฤติการณ์ที่อาจมีความเสี่ยงและรายงานหตุการณ์นั้นๆ หรือเหตุต้องสงสัยเกี่ยวกับการฟอกเงินต่อบริษัท", "แจ้งให้ลูกค้าทราบถึงการทำธุรกรรมที่มีความเสี่ยงสูงที่ลูกค้าได้ทำขึ้น", "ไม่ต้องทำอะไร เนื่องจากอยู่นอกเหนือขอบข่ายงาน"] },
            { q: "11. การติดสินบนคืออะไร?", a: "A", choices: ["การเสนอ สัญญาว่าจะให้ ให้ รับ เงินหรือผลประโยชน์อื่นใดเพื่อจูงใจในอันที่จะมีผลต่อการตัดสินใจเพื่อให้ได้ซึ่งผลประโยชน์ในเชิงพาณิชย์ ในทางสัญญา หรือในทางกฎหมาย", "การใช้อำนาจหน้าที่ในทางมิชอบเพื่อแสวงหาผลประโยชน์ส่วนบุคคล", "การมอบปฏิทินปีใหม่ของบริษัทให้แก่ลูกค้า", "ถูกทุกข้อ"] },

            { q: "15. ของขวัญประเภทใดอาจจะมีโอกาสเป็นการติดสินบนได้", a: "C", choices: ["ปฏิทินปีใหม่", "เสื้อยืดที่ระลึกของบริษัท", "โทรทัศน์"] },
            { q: "16. นายเอเป็นตัวแทนประกันชีวิตของบริษัท นำเงินค่าเบี้ยประกันภัยของลูกค้าเพื่อไปจ่ายค่ารักษาพยาบาลแม่ของตนที่กำลังป่วยหนัก ถึงแม้ว่าต่อมานายเอได้นำส่งเงินค่าเบี้ยประกันให้แก่บริษัทครบถ้วนตามระยะเวลาผ่อนผัน ดังนั้นการกระทำของนายเอถูกต้องหรือไม่", a: "B", choices: ["ถูกต้อง เนื่องจากเป็นการแสดงออกถึงความกตัญญูต่อมารดา", "ไม่ถูกต้อง เนื่องจากพฤติกรรมดังกล่าวถือว่ามีเจตนาส่อทุจริต และนายเอไม่มีสิทธินำเงินของลูกค้าไปใช้เพื่อประโยชน์ส่วนตัว"] },
            { q: "17. คุณต้องได้รับประโยชน์จากการฉ้อโกงจึงถือเป็นการกระทำความผิดตามกฎหมายใช่หรือไม่", a: "B", choices: ["ใช่", "ไม่ใช่"] },
            { q: "18. บุคคลที่กระทำทุจริตอาจได้รับโทษตามข้อใดดังต่อไปนี้", a: "D", choices: ["โทษจำคุก", "การบอกเลิกสัญญาจากบริษัท", "โทษทางวินัยของบริษัท", "ถูกทุกข้อ"] },
            { q: "19. นางใจเป็นตัวแทนประกันชีวิต ได้ออกใบรับเงินค่าเบี้ยประกันชีวิตให้แก่ลูกค้าเป็นบิลเงินสด เนื่องจากลืมนำใบเสร็จรับเงินชั่วคราวของบริษัทมา การกระทำของนางใจถูกต้องหรือไม่", a: "B", choices: ["ถูกต้อง เนื่องจากนางใจตั้งใจว่าจะนำส่งใบเสร็จรับเงินชั่วคราวของบริษัทให้แก่ลูกค้าในภายหลัง", "ไม่ถูกต้อง เนื่องจากการรับชำระเบี้ยจากลูกค้า ตัวแทนประกันชีวิตจะต้องออกใบเสร็จรับเงินของบริษัททุกครั้งที่มีการรับเบี้ยประกันในนามของบริษัท"] },
            { q: "20. ข้อใดต่อไปนี้อาจบ่งชี้ว่าอาจมีการกระทำทุจริต", a: "C", choices: ["ความไม่สมดุลระหว่างรายได้กับไลฟ์สไตล์ของบุคคลนั้น", "การรับของขวัญที่มีมูลค่าสูงจากลูกค้า", "ถูกทุกข้อ"] },
            { q: "21. ตัวแทนหรือนายหน้าแนะนำให้ผู้เอาประกันชีวิตยกเลิกกรมธรรม์ฉบับเก่าก่อนครบกำหนด เพื่อซื้อกรมธรรม์ฉบับใหม่ที่ให้ค่าบำเหน็จแก่ตัวแทนสูงขึ้น", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "22. ตัวแทนหรือนายหน้าเสนอส่วนลดค่าเบี้ยประกันชีวิตให้แก่ผู้เอาประกันชีวิต", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "23. ตัวแทนหรือนายหน้าจ่ายค่าเบี้ยประกันชีวิตให้แก่ผู้เอาประกันชีวิตไปก่อน แล้วให้ผู้เอาประกันชีวิตผ่อนจ่ายคืนค่าเบี้ยประกันชีวิตให้ภายหลัง โดยที่ผู้เอาประกันชีวิตรับทราบละยินยอมแล้ว", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "24. ตัวแทนหรือนายหน้าให้ผู้มุ่งหวังหรือผู้ทรงกรมธรรม์ลงลายมือชื่อในแบบฟอร์มเปล่า แล้วตัวแทนค่อยกรอกรายละเอียดการขอเอาประกันชีวิตให้ภายหลัง โดยที่ได้รับความยินยอมจากผู้มุ่งหวังหรือผู้ทรงกรมธรรม์แล้ว", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "25. ตัวแทนหรือนายหน้าแนะนำให้ผู้เอาประกันชีวิตซื้อสัญญาเพิ่มเติมแนบท้ายกรมธรรม์ฉบับเดิม", a: "A", choices: ["ถูก", "ผิด"] },
            { q: "26. ตัวแทนหรือนายหน้าแนะนำให้ผู้เอาประกันชีวิตซื้อกรมธรรม์ประกันชีวิตฉบับใหม่ ที่ให้ค่าบำเหน็จแก่ตัวแทนสูง และแจ้งผู้เอาประกันชีวิตว่าให้ยกเลิกกรมธรรม์ฉบับเก่าภายหลังจากได้รับกรมธรรม์ฉบับใหม่แล้ว", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "27. ตัวแทนหรือนายหน้าลงทุนทำสื่อส่งเสริมการขาย โฆษณา หรือโบรชัวร์ ซึ่งมีเนื้อหาเกี่ยวกับบริษัทฯ ด้วยตัวเอง โดยไม่ได้รับอนุญาตจากบริษัทฯ", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "28. ตัวแทนหรือนายหน้าเดินทางไปขายประกันชีวิตให้แก่ผู้มุ่งหวังที่ถือสัญชาติลาวและมีถิ่นพำนักอยู่ในประเทศลาว", a: "B", choices: ["ถูก", "ผิด"] },
            { q: "29. นายหน้าประกันชีวิตไม่ได้ยื่นใบอนุญาตตัวแทนให้ลูกค้าตรวจสอบ แต่ติดตั้งใบอนุญาตตัวแทนไว้บนเคาน์เตอร์ที่ขายประกันชีวิตให้แก่ลูกค้าเห็น", a: "A", choices: ["ถูก", "ผิด"] },
            { q: "30. ตัวอย่างของเรื่องที่ท่านสามารถรายงานผ่าน บริการเว็บไซต์และสายด่วน ‘Speak Out’ ข้อใดถูกต้อง", a: "D", choices: ["การติดสินบนหรือการทุจริต", "การใช้ข้อมูลภายในในทางที่มิชอบ", "การบัญชีหรือการตรวจสอบที่น่าสงสัย", "ถูกทุกข้อ"] }
        ];

        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        
        const certificateWrapper = document.getElementById('certificate-wrapper');
        const certName = document.getElementById('certName');
        const certCourseName = document.getElementById('certCourseName');
        const downloadCertBtn = document.getElementById('downloadCertBtn');
        const quizHeader = document.getElementById('quizHeader').textContent;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
            if (storedName) {
                nameInput.value = storedName;
            }
        });

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            try {
                const { error } = await supabase
                    .from('quiz_results')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience,
                        quiz_set: quizHeader
                    }]);

                if (error) throw error; 

                if (percentage >= 80) {
                    resultDiv.innerHTML = `🎉 ยินดีด้วย! คุณสอบผ่าน (${percentage}%) ได้คะแนน ${score} จาก ${totalQuestions} ข้อ`;
                    resultDiv.style.backgroundColor = '#d1ffd1';
                    resultDiv.style.color = '#005900';
                    
                    certName.textContent = userNameVal;
                    certCourseName.textContent = quizHeader.replace('แบบทดสอบปรนัย: ', '').replace(/\s*\(.*\)/, '');
                    
                    certificateWrapper.style.display = 'block';
                    quizForm.style.display = 'none';
                    submitBtn.style.display = 'none';
                } else {
                    resultDiv.innerHTML = `❌ คุณได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%) ยังไม่ผ่านเกณฑ์ (ต้องได้ 80% ขึ้นไป)`;
                    resultDiv.style.backgroundColor = '#ffd1d1';
                    resultDiv.style.color = '#900';
                    submitBtn.style.display = 'none';

                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'ทำแบบทดสอบใหม่อีกครั้ง';
                    retryBtn.style.backgroundColor = '#dc3545';
                    retryBtn.onclick = () => location.reload();
                    actionContainer.innerHTML = ''; 
                    actionContainer.appendChild(retryBtn);
                }

                resultDiv.style.display = 'block';

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });

        downloadCertBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
