    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f9faff;
            color: #333;
            padding: 20px;
        }
        h2 {
            color: #004080;
            text-align: center;
            margin-bottom: 30px;
        }
        .question-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 25px;

        }
        .question h3 {
            color: #0059b3;

            font-size: 1.1rem;
            line-height: 1.5;
        }
        .choices {
            list-style: none;
            padding: 0;
        }
        .choices li {
            margin-bottom: 8px;
        }
        .choices label {
            display: block;
            background: #e6f2ff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .choices label:hover {
            background-color: #cce6ff;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px auto 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #005fa3;
        }
        #result {
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
        }
        .loading-text {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 50px;
        }
        .hidden {
            display: none;
        }
        
        /* สไตล์สำหรับใบประกาศนียบัตรจำลอง */
        #certificate-wrapper {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
        #certificate {
            background: #fff;
            border: 15px solid #004080;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .cert-inner {
            border: 2px solid #d4af37;
            padding: 50px 30px;
            background-color: #faf9f5;
        }
        .cert-title {
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            font-size: 2.5rem; 
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .cert-name {
            color: #004080; 
            font-size: 2rem;
            border-bottom: 2px solid #004080; 
            display: inline-block; 
            padding: 0 40px 5px;
            margin: 20px 0;
            font-weight: bold;
        }
        
@media print {
            /* 1. ตั้งค่าหน้ากระดาษเป็น A4 แนวนอน และลบ Margin เพื่อซ่อน Header/Footer (วันที่, URL) */
            @page {

                margin: 0mm !important; 
            }
            
            /* 2. ซ่อนเนื้อหาทั้งหมดในหน้าเว็บ (ยกเว้นใบประกาศ) */

            #certificate-wrapper {

                align-items: center !important;

                top: 0 !important;

                height: 100vh !important;

            #certificate {
                display: block !important;
                width: 90% !important;
                max-width: 260mm !important; 
                margin: auto !important;
                position: static !important;

            #certificate-wrapper button, 
            #certificate-wrapper a {
                display: none !important;
            }
        }

</head>

            { q: "ข้อ 3: ผลประโยชน์รวมกรณีเสียชีวิตจากอุบัติเหตุในปีกรมธรรม์ที่ 1-9 จะได้รับเท่าใด?", a: "D", choices: ["100% ของทุนประกันอุบัติเหตุ", "100% ของทุนประกันชีวิต", "200% ของทุนประกันภัย", "ข้อ A และ B รวมกัน"] },
            { q: "ข้อ 4: เกณฑ์การรับประกันภัย จะต้องผ่านเงื่อนไขใด?", a: "D", choices: ["อายุ 20-60 ปี", "ตอบคำถามสุขภาพ 1 ข้อ", "อาชีพที่1-4", "ถูกทุกข้อ"] },
            { q: "ข้อ 5: สิทธิประโยชน์ทางภาษีสูงสุดที่สามารถนำเบี้ยประกันภัยไปลดหย่อนภาษีได้ต่อปีคือ?", a: "B", choices: ["50,000 บาท", "100,000 บาท", "150,000 บาท", "200,000 บาท"] },

            { q: "ข้อ 8: ผลประโยชน์เงินคืนระหว่างปีกรมธรรม์ที่ 2 – 9 จะได้รับเท่าใด?", a: "B", choices: ["2% ของทุนประกันภัย", "2.5% ของทุนประกันภัย", "4% ของทุนประกันภัย", "5% ของทุนประกันภัย"] },
            { q: "ข้อ 9: กรณีอยู่ครบสัญญาปีที่ 20 จะได้รับเงินครบกำหนดสัญญาเท่าใด?", a: "D", choices: ["100% ของทุนประกันภัย", "120% ของทุนประกันภัย", "150% ของทุนประกันภัย", "200% ของทุนประกันภัย"] },
            { q: "ข้อ 10: ระยะเวลาชำระเบี้ยประกันของแผนนี้คือกี่ปี?", a: "B", choices: ["8 ปี", "9 ปี", "10 ปี", "20 ปี"] },
            { q: "ข้อ 11: สัญญาเพิ่มเติมที่แนบท้ายแบบประกัน SuperSmartSave 20/9 คือข้อใด?", a: "C", choices: ["คุ้มครองสุขภาพ IPD", "คุ้มครองทุพพลภาพถาวร", "คุ้มครองการเสียชีวิตจากอุบัติเหตุ (ไม่คิดเบี้ยฯ)", "คุ้มครองโรคร้ายแรง"] },
            { q: "ข้อ 12: จำนวนเงินเอาประกันภัยขั้นต่ำของผลิตภัณฑ์นี้คือเท่าใด?", a: "C", choices: ["10,000 บาท", "30,000 บาท", "50,000บาท", "100,000บาท"] },
            { q: "ข้อ 13: ในปีกรมธรรม์ที่ 3–9 ผลประโยชน์กรณีเสียชีวิตขั้นต่ำเป็นเท่าใด?", a: "C", choices: ["100% ของเงินเอาประกันภัย", "110% ของเบี้ยที่ชำระแล้ว", "101% ของเบี้ยที่ชำระแล้ว หรือค่าเวนคืน หรือ 100% ของ SA อย่างใดมากกว่า", "200% ของเงินเอาประกันภัย"] },
            { q: "ข้อ 14: การคงเงินคืนระหว่างสัญญาไว้กับบริษัทเพื่อรับดอกเบี้ยเพิ่ม ทำได้หรือไม่?", a: "D", choices: ["ทำได้", "ทำได้เฉพาะปี 10 ขึ้นไป", "ทำได้เมื่อเลือกงวดรายปี", "ไม่สามารถทำได้"] },
            { q: "ข้อ 15: อัตราดอกเบี้ยการกู้ยืมตามกรมธรรม์ (Policy Loan) อยู่ที่เท่าใด?", a: "C", choices: ["5.0%", "6.0%", "7.2%", "8.0%"] },
            { q: "ข้อ 16: หากผู้เอาประกันภัยเวนคืนกรมธรรม์ก่อนครบกำหนดปีกรมธรรม์ จะได้รับเงินคืนระหว่างสัญญาหรือไม่?", a: "C", choices: ["ได้เต็มจำนวน", "ได้เฉพาะเงินคืนงวดล่าสุด", "ไม่ได้ เนื่องจากกรมธรรม์สิ้นสุด", "ได้เฉพาะเมื่อชำระเบี้ยครบ 9 ปี"] },
            { q: "ข้อ 17: เมื่อมูลค่าเวนคืน (CV) ไม่พอชำระเบี้ยฯ และอยู่ในสถานะ APL ต่อเนื่อง จะเกิดอะไรขึ้น?", a: "B", choices: ["กรมธรรม์หมดอายุทันที", "บริษัทเปลี่ยนสถานะเป็นขยายระยะเวลาอัตโนมัติ (AETI)", "ต้องตรวจสุขภาพใหม่", "เบี้ยถูกยกเว้นตลอดสัญญา"] },
            { q: "ข้อ 18: ข้อยกเว้นการคุ้มครองอุบัติเหตุข้อใด “ถูกต้อง”?", a: "D", choices: ["เสียชีวิตระหว่างขับขี่มอเตอร์ไซค์ยังได้รับความคุ้มครอง", "เสียชีวิตจากการแข่งรถได้รับความคุ้มครอง", "เสียชีวิตจากการดำน้ำแบบถังอากาศได้รับความคุ้มครอง", "เสียชีวิตจากการมีแอลกอฮอล์ในเลือดตั้งแต่ 150 mg% ขึ้นไป เป็นข้อยกเว้น"] },
            { q: "ข้อ 19: ระยะเวลาที่สามารถใช้สิทธิ Free Look (ขอยกเลิกกรมธรรม์และได้เงินคืนเต็มจำนวน) คือกี่วัน?", a: "C", choices: ["15 วัน", "20 วัน", "30 วัน", "45 วัน"] },
            { q: "ข้อ 20: เงินคืนระหว่างสัญญาในปีกรมธรรม์ที่ 2–9 อยู่ที่เท่าใด?", a: "B", choices: ["2%", "2.5%", "3%", "5%"] }
        ];

        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        
        const certificateWrapper = document.getElementById('certificate-wrapper');
        const certName = document.getElementById('certName');
        const certCourseName = document.getElementById('certCourseName');
        const downloadCertBtn = document.getElementById('downloadCertBtn');
        const quizHeader = document.getElementById('quizHeader').textContent;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
            if (storedName) {
                nameInput.value = storedName;
            }
        });

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            try {
                const { error } = await supabase
                    .from('quiz_results')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience,
                        quiz_set: quizHeader
                    }]);

                if (error) throw error; 

                if (percentage >= 80) {
                    resultDiv.innerHTML = `🎉 ยินดีด้วย! คุณสอบผ่าน (${percentage}%) ได้คะแนน ${score} จาก ${totalQuestions} ข้อ`;
                    resultDiv.style.backgroundColor = '#d1ffd1';
                    resultDiv.style.color = '#005900';
                    
                    certName.textContent = userNameVal;
                    certCourseName.textContent = quizHeader.replace('แบบทดสอบปรนัย: ', '').replace(/\s*\(.*\)/, '');
                    
                    certificateWrapper.style.display = 'block';
                    quizForm.style.display = 'none';
                    submitBtn.style.display = 'none';
                } else {
                    resultDiv.innerHTML = `❌ คุณได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%) ยังไม่ผ่านเกณฑ์ (ต้องได้ 80% ขึ้นไป)`;
                    resultDiv.style.backgroundColor = '#ffd1d1';
                    resultDiv.style.color = '#900';
                    submitBtn.style.display = 'none';

                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'ทำแบบทดสอบใหม่อีกครั้ง';
                    retryBtn.style.backgroundColor = '#dc3545';
                    retryBtn.onclick = () => location.reload();
                    actionContainer.innerHTML = ''; 
                    actionContainer.appendChild(retryBtn);
                }

                resultDiv.style.display = 'block';

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });

        downloadCertBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
