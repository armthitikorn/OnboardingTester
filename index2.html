<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แบบทดสอบ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* โค้ด CSS สไตล์เดิม */
        body {
            font-family: 'Sarabun', sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f9faff;
            color: #333;
            padding: 20px;
        }
        h2 {
            color: #004080;
            text-align: center;
            margin-bottom: 30px;
        }
        .question-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
        }
        .question h3 {
            color: #0059b3;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        .choices {
            list-style: none;
            padding: 0;
        }
        .choices li {
            margin-bottom: 8px;
        }
        .choices label {
            display: block;
            background: #e6f2ff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .choices label:hover {
            background-color: #cce6ff;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px auto 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #005fa3;
        }
        #result {
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
        }
        .loading-text {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 50px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <h2>แบบทดสอบปรนัย: SuperSmartSave 20/9 (20 ข้อ)</h2>

    <div id="loading" class="loading-text">กำลังโหลดแบบทดสอบ...</div>

    <div style="margin-bottom: 20px;"><label for="name">ชื่อผู้ทำแบบทดสอบ:</label><input type="text" id="name" name="name" required style="width:100%;padding:10px;margin-top:5px;"></div>
<form id="quizForm" class="hidden"></form>

    <button id="submitBtn" class="hidden">ส่งคำตอบ</button>

    <div id="result"></div>
    
    <a href="index1.html">
        <button style="margin-top: 20px;">ไปหน้าถัดไป</button>
    </a>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // --- Supabase Setup ---
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // ข้อมูลคำถาม (ใช้ข้อมูลเดิมทั้งหมด)
const questions = [
    { q: "ข้อ 1: กรณีเสียชีวิตจากการเจ็บป่วยในปีกรมธรรม์ที่ 1 ผู้รับประโยชน์จะได้รับเท่าใด?", a: "B", choices: ["100% ของเบี้ยประกันภัยที่ชำระแล้ว", "110% ของเบี้ยประกันภัยที่ชำระแล้ว", "101% ของเบี้ยประกันภัยที่ชำระแล้ว", "200% ของเบี้ยประกันภัยที่ชำระแล้ว"] },
    { q: "ข้อ 2: ในปีกรมธรรม์ที่ 10-20 ผลประโยชน์กรณีเสียชีวิตสุขภาพจะได้รับเท่าใด?", a: "C", choices: ["101% ของเบี้ยประกันภัยที่ชำระแล้ว หรือเงินลงทุนประกันภัย", "110% ของเบี้ยประกันภัยที่ชำระแล้ว", "200% ของทุนประกัน", "150% ของเบี้ยประกันภัยที่ชำระแล้ว"] },
    { q: "ข้อ 3: ผลประโยชน์รวมกรณีเสียชีวิตจากอุบัติเหตุในปีกรมธรรม์ที่ 1-9 จะได้รับเท่าใด?", a: "D", choices: ["100% ของทุนประกันอุบัติเหตุ", "100% ของทุนประกันชีวิต", "200% ของทุนประกันภัย", "ข้อ A และ B รวมกัน"] },
    { q: "ข้อ 4: เกณฑ์การรับประกันภัย จะต้องผ่านเงื่อนไขใด?", a: "D", choices: ["อายุ 20-60 ปี", "ตอบคำถามสุขภาพ 1 ข้อ", "อาชีพที่1-4", "ถูกทุกข้อ"] },
    { q: "ข้อ 5: สิทธิประโยชน์ทางภาษีสูงสุดที่สามารถนำเบี้ยประกันภัยไปลดหย่อนภาษีได้ต่อปีคือ?", a: "B", choices: ["50,000 บาท", "100,000 บาท", "150,000 บาท", "200,000 บาท"] },
    { q: "ข้อ 6: ผลิตภัณฑ์ Endowment 20/9 ผ่านช่องทาง DMTM สามารถซื้อทุนประกันภัยสูงสุดต่อคนได้เท่าใด?", a: "C", choices: ["100,000 บาท", "300,000 บาท", "500,000 บาท", "1,000,000 บาท"] },
    { q: "ข้อ 7: อายุที่สามารถทำประกันในแผนนี้ได้อยู่ระหว่างเท่าใด?", a: "B", choices: ["18 – 55 ปี", "20 – 60 ปี", "21 – 65 ปี", "25 – 70 ปี"] },
    { q: "ข้อ 8: ผลประโยชน์เงินคืนระหว่างปีกรมธรรม์ที่ 2 – 9 จะได้รับเท่าใด?", a: "B", choices: ["2% ของทุนประกันภัย", "2.5% ของทุนประกันภัย", "4% ของทุนประกันภัย", "5% ของทุนประกันภัย"] },
    { q: "ข้อ 9: กรณีอยู่ครบสัญญาปีที่ 20 จะได้รับเงินครบกำหนดสัญญาเท่าใด?", a: "D", choices: ["100% ของทุนประกันภัย", "120% ของทุนประกันภัย", "150% ของทุนประกันภัย", "200% ของทุนประกันภัย"] },
    { q: "ข้อ 10: ระยะเวลาชำระเบี้ยประกันของแผนนี้คือกี่ปี?", a: "B", choices: ["8 ปี", "9 ปี", "10 ปี", "20 ปี"] },
    { q: "ข้อ 11: สัญญาเพิ่มเติมที่แนบท้ายแบบประกัน SuperSmartSave 20/9 คือข้อใด?", a: "C", choices: ["คุ้มครองสุขภาพ IPD", "คุ้มครองทุพพลภาพถาวร", "คุ้มครองการเสียชีวิตจากอุบัติเหตุ (ไม่คิดเบี้ยฯ)", "คุ้มครองโรคร้ายแรง"] },
    { q: "ข้อ 12: จำนวนเงินเอาประกันภัยขั้นต่ำของผลิตภัณฑ์นี้คือเท่าใด?", a: "C", choices: ["10,000 บาท", "30,000 บาท", "50,000บาท", "100,000บาท"] },
    { q: "ข้อ 13: ในปีกรมธรรม์ที่ 3–9 ผลประโยชน์กรณีเสียชีวิตขั้นต่ำเป็นเท่าใด?", a: "C", choices: ["100% ของเงินเอาประกันภัย", "110% ของเบี้ยที่ชำระแล้ว", "101% ของเบี้ยที่ชำระแล้ว หรือค่าเวนคืน หรือ 100% ของ SA อย่างใดมากกว่า", "200% ของเงินเอาประกันภัย"] },
    { q: "ข้อ 14: การคงเงินคืนระหว่างสัญญาไว้กับบริษัทเพื่อรับดอกเบี้ยเพิ่ม ทำได้หรือไม่?", a: "D", choices: ["ทำได้", "ทำได้เฉพาะปี 10 ขึ้นไป", "ทำได้เมื่อเลือกงวดรายปี", "ไม่สามารถทำได้"] },
    { q: "ข้อ 15: อัตราดอกเบี้ยการกู้ยืมตามกรมธรรม์ (Policy Loan) อยู่ที่เท่าใด?", a: "C", choices: ["5.0%", "6.0%", "7.2%", "8.0%"] },
    { q: "ข้อ 16: หากผู้เอาประกันภัยเวนคืนกรมธรรม์ก่อนครบกำหนดปีกรมธรรม์ จะได้รับเงินคืนระหว่างสัญญาหรือไม่?", a: "C", choices: ["ได้เต็มจำนวน", "ได้เฉพาะเงินคืนงวดล่าสุด", "ไม่ได้ เนื่องจากกรมธรรม์สิ้นสุด", "ได้เฉพาะเมื่อชำระเบี้ยครบ 9 ปี"] },
    { q: "ข้อ 17: เมื่อมูลค่าเวนคืน (CV) ไม่พอชำระเบี้ยฯ และอยู่ในสถานะ APL ต่อเนื่อง จะเกิดอะไรขึ้น?", a: "B", choices: ["กรมธรรม์หมดอายุทันที", "บริษัทเปลี่ยนสถานะเป็นขยายระยะเวลาอัตโนมัติ (AETI)", "ต้องตรวจสุขภาพใหม่", "เบี้ยถูกยกเว้นตลอดสัญญา"] },
    { q: "ข้อ 18: ข้อยกเว้นการคุ้มครองอุบัติเหตุข้อใด “ถูกต้อง”?", a: "D", choices: ["เสียชีวิตระหว่างขับขี่มอเตอร์ไซค์ยังได้รับความคุ้มครอง", "เสียชีวิตจากการแข่งรถได้รับความคุ้มครอง", "เสียชีวิตจากการดำน้ำแบบถังอากาศได้รับความคุ้มครอง", "เสียชีวิตจากการมีแอลกอฮอล์ในเลือดตั้งแต่ 150 mg% ขึ้นไป เป็นข้อยกเว้น"] },
    { q: "ข้อ 19: ระยะเวลาที่สามารถใช้สิทธิ Free Look (ขอยกเลิกกรมธรรม์และได้เงินคืนเต็มจำนวน) คือกี่วัน?", a: "C", choices: ["15 วัน", "20 วัน", "30 วัน", "45 วัน"] },
    { q: "ข้อ 20: เงินคืนระหว่างสัญญาในปีกรมธรรม์ที่ 2–9 อยู่ที่เท่าใด?", a: "B", choices: ["2%", "2.5%", "3%", "5%"] }
];
 // --- DOM Elements ---
    const quizForm = document.getElementById('quizForm');
    const submitBtn = document.getElementById('submitBtn');
    const loading = document.getElementById('loading');
    const resultDiv = document.getElementById('result');

    // โหลดชื่อ และ ประสบการณ์ จาก Session / URL มาใส่ใน Input อัตโนมัติ (ถ้ามี)
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
        if (storedName) {
            document.getElementById('name').value = storedName;
        }
    });

    function renderQuiz() {
        loading.classList.add('hidden');
        quizForm.classList.remove('hidden');
        submitBtn.classList.remove('hidden');

        questions.forEach((q, index) => {
            const container = document.createElement('div');
            container.className = 'question-container';

            const questionTitle = document.createElement('h3');
            questionTitle.textContent = q.q;
            container.appendChild(questionTitle);

            const ul = document.createElement('ul');
            ul.className = 'choices';

            q.choices.forEach((choice, i) => {
                const li = document.createElement('li');
                const label = document.createElement('label');
                const input = document.createElement('input');
                input.type = 'radio';
                input.name = `question-${index}`;
                input.value = String.fromCharCode(65 + i);
                label.appendChild(input);
                label.appendChild(document.createTextNode(`${input.value}. ${choice}`));
                li.appendChild(label);
                ul.appendChild(li);
            });

            container.appendChild(ul);
            quizForm.appendChild(container);
        });
    }
    
    async function initialize() {
        try {
            const { data: { user }, error } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
            }
        } catch (e) {
            console.warn("Could not retrieve current user. Running as anonymous.", e);
        }

        renderQuiz();
    }

    initialize();

    // --- Event Listener: Submit Button ---
    submitBtn.addEventListener('click', async () => {
        submitBtn.disabled = true;

        let score = 0;
        const answers = [];

        // 1. คำนวณคะแนนและรวบรวมคำตอบ
        questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const answer = selected ? selected.value : null; 
            answers.push(answer);
            if (answer === q.a) score++;
        });

        const totalQuestions = questions.length;
        
        // 🔥 ดึงข้อมูล Email, Name และ Experience จาก URL Params หรือ sessionStorage
        const urlParams = new URLSearchParams(window.location.search);
        
        const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
        const userName = document.getElementById('name').value.trim() || urlParams.get('name') || sessionStorage.getItem('user_name') || "ไม่ระบุชื่อ";
        
        // 🔥 ดึงค่าประสบการณ์ (Experience)
        const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

        // 2. บันทึกผลลัพธ์โดยใช้ Supabase Client (แนบ experience ไปด้วย)
        const { error } = await supabase
            .from('quiz_results')
            .insert([
                {
                    user_email: userEmail,
                    name: userName,
                    score: score,
                    total_questions: totalQuestions,
                    answers: answers,
                    experience: userExperience // 🔥 บันทึกค่าประสบการณ์ลง Supabase ที่นี่!
                }
            ]);

        // 3. จัดการผลลัพธ์และการแสดงผล
        if (error) {
            console.error('Error saving quiz result:', error.message);
            resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (รหัส: ${error.code}) กรุณาลองใหม่`;
            resultDiv.style.backgroundColor = '#ffd1d1';
            resultDiv.style.color = '#900';
            submitBtn.disabled = false;
        } else {
            console.log("Quiz result saved successfully.");
            resultDiv.textContent = `บันทึกผลสำเร็จ! คุณได้คะแนน ${score} จาก ${totalQuestions} ข้อ`;
            resultDiv.style.backgroundColor = '#d1ffd1';
            resultDiv.style.color = '#005900';
        }

        resultDiv.style.display = 'block';
    });
</script>
</body>
</html>
