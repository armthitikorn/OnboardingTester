<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แบบทดสอบ: SalesForce</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            max-width: 900px;
            margin: 30px auto;
            background-color: #f9faff;
            color: #333;
            padding: 20px;
        }
        h2 {
            color: #004080;
            text-align: center;
            margin-bottom: 30px;
        }
        .question-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 25px;
            margin-bottom: 25px;
        }
        .question h3 {
            color: #0059b3;
            margin-bottom: 10px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .choices {
            list-style: none;
            padding: 0;
        }
        .choices li {
            margin-bottom: 8px;
        }
        .choices label {
            display: block;
            background: #e6f2ff;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .choices label:hover {
            background-color: #cce6ff;
        }
        input[type="radio"] {
            margin-right: 10px;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            padding: 15px;
            font-size: 1.1rem;
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 20px auto 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        button:hover {
            background-color: #005fa3;
        }
        #result {
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            font-size: 1.2rem;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: none;
        }
        .loading-text {
            text-align: center;
            font-style: italic;
            color: #666;
            margin-top: 50px;
        }
        .hidden {
            display: none;
        }
        
        /* สไตล์สำหรับใบประกาศนียบัตรจำลอง */
        #certificate-wrapper {
            display: none;
            text-align: center;
            margin-top: 40px;
        }
        #certificate {
            background: #fff;
            border: 15px solid #004080;
            padding: 15px;
            text-align: center;
            border-radius: 4px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .cert-inner {
            border: 2px solid #d4af37;
            padding: 50px 30px;
            background-color: #faf9f5;
        }
        .cert-title {
            color: #d4af37; 
            font-family: 'Georgia', serif; 
            font-size: 2.5rem; 
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .cert-name {
            color: #004080; 
            font-size: 2rem;
            border-bottom: 2px solid #004080; 
            display: inline-block; 
            padding: 0 40px 5px;
            margin: 20px 0;
            font-weight: bold;
        }
        
        @media print {
            @page {
                size: A4 landscape;
                margin: 0mm !important; 
            }
            
            body > *:not(#certificate-wrapper) {
                display: none !important;
            }

            #certificate-wrapper {
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
            }

            #certificate {
                display: block !important;
                width: 90% !important;
                max-width: 260mm !important; 
                margin: auto !important;
                position: static !important;
                transform: none !important;
                box-shadow: none !important;
                page-break-inside: avoid !important;
            }

            #certificate-wrapper button, 
            #certificate-wrapper a {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <h2 id="quizHeader">แบบทดสอบปรนัย: SalesForce (10 ข้อ)</h2>

    <div id="loading" class="loading-text">กำลังโหลดแบบทดสอบ...</div>

    <div style="margin-bottom: 20px;">
        <label for="name">ชื่อผู้ทำแบบทดสอบ:</label>
        <input type="text" id="name" name="name" required style="width:100%;padding:10px;margin-top:5px;" placeholder="กรุณากรอกชื่อ-นามสกุล">
    </div>
    
    <form id="quizForm" class="hidden"></form>

    <button id="submitBtn" class="hidden">ส่งคำตอบ</button>

    <div id="result"></div>
    <div id="actionContainer" style="text-align: center; margin-top: 20px;"></div>

    <!-- ส่วนแสดงใบประกาศนียบัตร -->
    <div id="certificate-wrapper">
        <div id="certificate">
            <div class="cert-inner">
                <h1 class="cert-title">Certificate of Achievement</h1>
                <p style="font-size: 1.2rem; color: #555; margin-top: 20px;">ขอมอบประกาศนียบัตรฉบับนี้เพื่อให้เกียรติว่า</p>
                <h2 id="certName" class="cert-name">-</h2>
                <p style="font-size: 1.2rem; color: #555; margin-top: 10px;">
                    ได้ผ่านการทดสอบหลักสูตร <br> 
                    <strong id="certCourseName" style="color: #333; font-size: 1.5rem;">-</strong> <br> 
                    ด้วยคะแนนที่ผ่านเกณฑ์มาตรฐานอย่างสมบูรณ์
                </p>
                <div style="margin-top: 50px; text-align: center;">
                    <div style="display: inline-block; width: 200px; border-top: 1px solid #333; padding-top: 10px; margin: 0 20px;">
                        <p style="margin: 0; font-size: 0.9rem;">Prudential Life Assurance</p>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="downloadCertBtn" style="background-color: #28a745; max-width: 250px; margin: 30px auto;">
            📥 ดาวน์โหลดใบประกาศ
        </button>
        <!-- ลิงก์สิ้นสุดหลักสูตรหรือกลับหน้าหลัก -->
        <a href="index.html" id="nextPageLink" style="text-decoration: none;">
            <button style="margin-top: 10px; background-color: #28a745; max-width: 250px; margin: 10px auto;">🏠 กลับสู่หน้าหลัก</button>
        </a>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // --- Supabase Setup ---
        const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6d3lvdHp6eHljcWZ3ZXJjYWtoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTcwNTg3MTMsImV4cCI6MjA3MjYzNDcxM30.lgiAf9oBUqsaWGb3u_80wuoKAODQHE_lIBxpGumhrno';
        const supabase = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;

        // ข้อมูลคำถาม ชุดที่ 10 (SalesForce)[cite: 35]
        const questions = [
            { q: "1.Lead สถานะ Call Back หลังจากติดต่ออีกครั้งลูกค้าไม่รับสายต้องลงสถานะใด", a: "A", choices: ["Call Back", "No Contact", "In Progress", "Closed"] },
            { q: "2.การเข้าหน้า Lead New", a: "A", choices: ["กดที่ ปุ่ม หน้าแรก แล้วคลิก ที่ Leads", "กดที่ปุ่ม หน้าแรก แล้วคลิก รายงาน", "กดปุ่ม ติดต่อลูกค้า", "ไม่มีข้อใดถูก"] },
            { q: "3.เราจะเห็น New Leads จาก การคลิกที่ปุ่มใด", a: "B", choices: ["คลิกที่ปุ่ม ล่าสุด เลือก InProgress Call Back", "คลิกที่ปุ่ม ล่าสุด เลือก Assign Leads to me", "คลิกที่ปุ่ม ค้นหา", "คลิกที่ปุ่ม รายงาน"] },
            { q: "4.การจะโทรออกหาลูกค้าต้องทำอย่างไร", a: "A", choices: ["คลิก ที่ชื่อลูกค้า แล้วจะเห็นเบอร์โทรสามารถคลิกที่เบอร์ได้เลย", "คลิก ที่นามสกุลลูกค้า แล้วจะเห็นเบอร์โทรสามารถคลิกที่เบอร์ได้เลย", "พิมพ์เบอร์โทรศัพท์ใหม่", "โอนสายไปให้หัวหน้างาน"] },
            { q: "5.ในการแก้ไขข้อมูลต่างในโปรแกรม Salesforce ต้องคลิกที่ปุ่มใดจำเป็นต้องตอบ.", a: "A", choices: ["สามารถคลิกที่ รูป ดินสอเพื่อแก้ไขข้อมูลได้", "ไม่สามารถแก้ไขข้อมูลได้", "คลิกที่รูป ยางลบ", "คลิกที่รูป เซฟ"] },
            { q: "6.ตามขั้นตอนของการลง Status ของ Leads  คำว่า InProgress Call back คือ สถานะใดจำเป็นต้อง", a: "A", choices: ["ติดต่ออีกครั้ง นำเสนอแล้วแต่ขอติดสินใจ", "ติดต่ออีกครั้ง เจอตัวแต่ยังไม่ได้นำเสนอ", "ลูกค้าตอบตกลง", "ลูกค้าปฏิเสธ"] },
            { q: "7.ตามขั้นตอนของการลง Status ของ Leads  คำว่า InProgress No contact  คือ สถานะใดจำเป็นต้อง มีคนรับแต่ไม่ใช่เจ้าตัว", a: "A", choices: ["ไม่มีผู้รับสาย", "มีคนรับแต่ไม่ใช่เจ้าตัว", "สายไม่ว่าง", "ฝากข้อความ"] },
            { q: "8.ตามขั้นตอนของการลง Status ของ Leads  คำว่า InProgress Present Product Follow Up  คือ สถานะใดจำเป็นต้องตอบ.", a: "A", choices: ["ติดต่ออีกครั้งเพื่อติดตามผล หรือปิดการขาย", "ติดต่อเพื่อนำเสนอขาย", "ปิดการขายสำเร็จ", "ลูกค้ายกเลิกกรมธรรม์"] },
            { q: "9.ตามขั้นตอนของการลง Status ของ Leads  คำว่า Health Evaluation คือ สถานะใดจำเป็นต้องตอบ.", a: "A", choices: ["เปิดคำถามสุขภาพ 5 ข้อเพื่อลงสถานะเรื่องสุขภาพลูกค้า", "การลงทะเบียนการขาย", "ประเมินเบี้ยประกัน", "ยกเลิกกรรมธรรม์"] },
            { q: "10.หากลูกค้า ติดปัญหาสุขภาพ ต้องอ่าน Regal บทใดจำเป็นต้องตอบ.", a: "B", choices: ["Healthy", "Un Healthy", "Standard", "Declined"] }
        ];

        const quizForm = document.getElementById('quizForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultDiv = document.getElementById('result');
        const actionContainer = document.getElementById('actionContainer');
        const nameInput = document.getElementById('name');
        
        const certificateWrapper = document.getElementById('certificate-wrapper');
        const certName = document.getElementById('certName');
        const certCourseName = document.getElementById('certCourseName');
        const downloadCertBtn = document.getElementById('downloadCertBtn');
        const quizHeader = document.getElementById('quizHeader').textContent;

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const storedName = urlParams.get('name') || sessionStorage.getItem('user_name');
            if (storedName) {
                nameInput.value = storedName;
            }
        });

        function renderQuiz() {
            loading.classList.add('hidden');
            quizForm.classList.remove('hidden');
            submitBtn.classList.remove('hidden');

            questions.forEach((q, index) => {
                const container = document.createElement('div');
                container.className = 'question-container';

                const questionTitle = document.createElement('h3');
                questionTitle.textContent = q.q;
                container.appendChild(questionTitle);

                const ul = document.createElement('ul');
                ul.className = 'choices';

                q.choices.forEach((choice, i) => {
                    const li = document.createElement('li');
                    const label = document.createElement('label');
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = String.fromCharCode(65 + i);
                    label.appendChild(input);
                    label.appendChild(document.createTextNode(` ${input.value}. ${choice}`));
                    li.appendChild(label);
                    ul.appendChild(li);
                });

                container.appendChild(ul);
                quizForm.appendChild(container);
            });
        }
        
        async function initialize() {
            try {
                const { data: { user }, error } = await supabase.auth.getUser();
                if (user) currentUser = user;
            } catch (e) {
                console.warn("Could not retrieve current user.", e);
            }
            renderQuiz();
        }

        initialize();

        submitBtn.addEventListener('click', async () => {
            const userNameVal = nameInput.value.trim();
            if (!userNameVal) {
                alert("กรุณากรอกชื่อผู้ทำแบบทดสอบก่อนส่งคำตอบครับ");
                nameInput.focus();
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'กำลังส่งคำตอบ...';

            let score = 0;
            const answers = [];

            questions.forEach((q, index) => {
                const selected = document.querySelector(`input[name="question-${index}"]:checked`);
                const answer = selected ? selected.value : null; 
                answers.push(answer);
                if (answer === q.a) score++;
            });

            const totalQuestions = questions.length;
            const percentage = Math.round((score / totalQuestions) * 100);
            
            const urlParams = new URLSearchParams(window.location.search);
            const userEmail = urlParams.get('email') || sessionStorage.getItem('user_email') || currentUser?.email || "anonymous@example.com";
            const userExperience = urlParams.get('experience') || sessionStorage.getItem('user_experience') || "ไม่ระบุ";

            try {
                const { error } = await supabase
                    .from('quiz_results')
                    .insert([{
                        user_email: userEmail,
                        name: userNameVal,
                        score: score,
                        total_questions: totalQuestions,
                        answers: answers,
                        experience: userExperience,
                        quiz_set: quizHeader
                    }]);

                if (error) throw error; 

                if (percentage >= 80) {
                    resultDiv.innerHTML = `🎉 ยินดีด้วย! คุณสอบผ่าน (${percentage}%) ได้คะแนน ${score} จาก ${totalQuestions} ข้อ`;
                    resultDiv.style.backgroundColor = '#d1ffd1';
                    resultDiv.style.color = '#005900';
                    
                    certName.textContent = userNameVal;
                    certCourseName.textContent = quizHeader.replace('แบบทดสอบปรนัย: ', '').replace(/\s*\(.*\)/, '');
                    
                    certificateWrapper.style.display = 'block';
                    quizForm.style.display = 'none';
                    submitBtn.style.display = 'none';
                } else {
                    resultDiv.innerHTML = `❌ คุณได้คะแนน ${score} จาก ${totalQuestions} ข้อ (${percentage}%) ยังไม่ผ่านเกณฑ์ (ต้องได้ 80% ขึ้นไป)`;
                    resultDiv.style.backgroundColor = '#ffd1d1';
                    resultDiv.style.color = '#900';
                    submitBtn.style.display = 'none';

                    const retryBtn = document.createElement('button');
                    retryBtn.textContent = 'ทำแบบทดสอบใหม่อีกครั้ง';
                    retryBtn.style.backgroundColor = '#dc3545';
                    retryBtn.onclick = () => location.reload();
                    actionContainer.innerHTML = ''; 
                    actionContainer.appendChild(retryBtn);
                }

                resultDiv.style.display = 'block';

            } catch (err) {
                console.error('Error saving quiz result:', err.message || err);
                resultDiv.textContent = `เกิดข้อผิดพลาดในการบันทึกผล (ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต) กรุณาลองใหม่`;
                resultDiv.style.backgroundColor = '#ffd1d1';
                resultDiv.style.color = '#900';
                resultDiv.style.display = 'block';
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'ส่งคำตอบ';
            }
        });

        downloadCertBtn.addEventListener('click', () => {
            window.print();
        });
    </script>
</body>
</html>
